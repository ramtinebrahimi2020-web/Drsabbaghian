name: Deploy client preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Payload's admin and API routes require a database. The public client
      # review uses the statically authored front-end routes only.
      - name: Build static client preview
        shell: bash
        run: |
          mv 'src/app/(payload)' .payload-routes-for-preview
          STATIC_PREVIEW=true npx next build
          mv .payload-routes-for-preview 'src/app/(payload)'
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=./fa/"><title>Dr Sabbaghian</title><a href="./fa/">Open website</a>' > out/index.html
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
